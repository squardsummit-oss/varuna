# Installed by `make setup` (pre-commit install). Every hook mirrors a CI step so a commit
# that passes locally passes on the runner. Local hooks call the workspace binaries through
# pnpm so nothing needs a global install.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(docs/research/_raw/|.*\.(svg|pgw|csv)$)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^docs/research/_raw/
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
        # tsconfig files are JSONC (comments, trailing commas) and are validated by tsc.
        exclude: ^(.*/)?tsconfig[^/]*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier --check (apps/command)
        entry: pnpm --filter @varuna/command exec prettier --check
        language: system
        files: ^apps/command/.*\.(ts|tsx|js|mjs|css|json|md)$
        exclude: ^apps/command/(lib/api/types\.ts|openapi\.json|next-env\.d\.ts)$
        pass_filenames: true
      - id: design-lint
        name: pnpm lint:design (tokens, fonts, motion, no emoji)
        entry: pnpm lint:design
        language: system
        files: ^apps/command/(app|components/varuna|components/v0|components/map|lib)/.*\.(ts|tsx|css)$
        pass_filenames: false
