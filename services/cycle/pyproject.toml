[project]
name = "varuna-cycle"
version = "0.1.0"
description = "VARUNA cycle service"
requires-python = ">=3.12,<3.13"
dependencies = ["varuna-schemas", "structlog>=24", "pyyaml>=6", "numpy>=2", "pandas>=2.2", "pyarrow>=17", "varuna-sky", "varuna-twin", "varuna-pulse", "varuna-flash", "varuna-products", "varuna-route", "varuna-replay", "varuna-city"]

[tool.uv.sources]
varuna-schemas = { workspace = true }
varuna-api = { workspace = true }
varuna-city = { workspace = true }
varuna-replay = { workspace = true }
varuna-sky = { workspace = true }
varuna-twin = { workspace = true }
varuna-pulse = { workspace = true }
varuna-flash = { workspace = true }
varuna-products = { workspace = true }
varuna-route = { workspace = true }
varuna-cycle = { workspace = true }
varuna-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_cycle"]
