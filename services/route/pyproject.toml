[project]
name = "varuna-route"
version = "0.1.0"
description = "VARUNA route service"
requires-python = ">=3.12,<3.13"
dependencies = ["varuna-schemas", "networkx>=3.3", "numpy>=2", "shapely>=2.0", "geopandas>=1.0", "pandas>=2.2", "pyarrow>=17", "scipy>=1.14"]

[tool.uv.sources]
varuna-schemas = { workspace = true }
varuna-api = { workspace = true }
varuna-city = { workspace = true }
varuna-replay = { workspace = true }
varuna-sky = { workspace = true }
varuna-twin = { workspace = true }
varuna-pulse = { workspace = true }
varuna-flash = { workspace = true }
varuna-products = { workspace = true }
varuna-route = { workspace = true }
varuna-cycle = { workspace = true }
varuna-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_route"]
