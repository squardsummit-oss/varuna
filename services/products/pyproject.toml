[project]
name = "varuna-products"
version = "0.1.0"
description = "VARUNA products service"
requires-python = ">=3.12,<3.13"
dependencies = ["varuna-schemas", "numpy>=2", "pandas>=2.2", "pyarrow>=17", "geopandas>=1.0", "shapely>=2.0", "pillow>=10", "lxml>=5", "xmlschema>=3", "pyyaml>=6", "rasterio>=1.4", "xarray>=2024.7", "zarr>=2.18", "varuna-flash", "varuna-twin", "varuna-route"]

[tool.uv.sources]
varuna-schemas = { workspace = true }
varuna-api = { workspace = true }
varuna-city = { workspace = true }
varuna-replay = { workspace = true }
varuna-sky = { workspace = true }
varuna-twin = { workspace = true }
varuna-pulse = { workspace = true }
varuna-flash = { workspace = true }
varuna-products = { workspace = true }
varuna-route = { workspace = true }
varuna-cycle = { workspace = true }
varuna-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_products"]
