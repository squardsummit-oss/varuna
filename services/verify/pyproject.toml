[project]
name = "varuna-verify"
version = "0.1.0"
description = "VARUNA verify service"
requires-python = ">=3.12,<3.13"
dependencies = ["varuna-schemas", "numpy>=2", "pandas>=2.2", "scikit-learn>=1.5", "xarray>=2024.7", "zarr>=2.18", "matplotlib>=3.9", "pyarrow>=17", "varuna-sky", "varuna-route"]

[tool.uv.sources]
varuna-schemas = { workspace = true }
varuna-api = { workspace = true }
varuna-city = { workspace = true }
varuna-replay = { workspace = true }
varuna-sky = { workspace = true }
varuna-twin = { workspace = true }
varuna-pulse = { workspace = true }
varuna-flash = { workspace = true }
varuna-products = { workspace = true }
varuna-route = { workspace = true }
varuna-cycle = { workspace = true }
varuna-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_verify"]
