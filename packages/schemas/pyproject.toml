[project]
name = "varuna-schemas"
version = "0.1.0"
description = "VARUNA shared Pydantic models, JSON schemas and design tokens"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "pyyaml>=6", "orjson>=3.10", "truststore>=0.10", "structlog>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varuna_schemas"]
